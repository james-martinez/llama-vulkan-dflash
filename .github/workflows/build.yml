name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-vulkan:
    name: Linux Vulkan build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            git \
            glslc \
            libvulkan-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-venv \
            wget

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: linux-vulkan-ccache-${{ github.sha }}
          restore-keys: |
            linux-vulkan-ccache-

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGGML_NATIVE=OFF \
            -DGGML_VULKAN=ON \
            -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_CURL=OFF \
            -DLLAMA_OPENSSL=OFF

      - name: Build
        run: cmake --build build --config Release --target llama-cli llama-server test-backend-ops

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-linux-x64
          if-no-files-found: error
          path: |
            build/bin/llama-cli
            build/bin/llama-server
            build/bin/test-backend-ops

  windows-vulkan:
    name: Windows Vulkan build
    runs-on: windows-latest
    timeout-minutes: 90

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      VULKAN_SDK_VERSION: 1.3.283.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install ninja wget -y --no-progress

          $installer = "$env:RUNNER_TEMP\VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          wget -q -O $installer $url
          Start-Process -FilePath $installer -ArgumentList "--root C:\VulkanSDK\$env:VULKAN_SDK_VERSION --accept-licenses --default-answer --confirm-command install" -Wait -NoNewWindow

          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PATH=C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DGGML_VULKAN=ON `
            -DLLAMA_BUILD_TESTS=ON `
            -DLLAMA_CURL=OFF `
            -DLLAMA_OPENSSL=OFF `
            -DBUILD_SHARED_LIBS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --target llama-cli llama-server test-backend-ops

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-windows-x64
          if-no-files-found: error
          path: |
            build/bin/**/*.exe
            build/bin/**/*.dll
